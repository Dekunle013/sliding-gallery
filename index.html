<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sliding Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="slider">
      <div class="slide"><img src="tomJerry.jpg" alt="Photo 1" /></div>
      <div class="slide"><img src="scooby.jpg" alt="Photo 2" /></div>
      <div class="slide"><img src="aot.jpg" alt="Photo 3" /></div>
      <div class="slide"><img src="simp.jpg" alt="Photo 4" /></div>
      <div class="slide"><img src="guiseppina.png" alt="Photo 5" /></div>
      <div class="slide"><img src="sponge.jpg" alt="Photo 6" /></div>
      <div class="slide"><img src="mohammed.png" alt="Photo 7" /></div>
      <div class="slide"><img src="Abuja_.jpg" alt="Photo 8" /></div>
      <div class="slide"><img src="lagosYellow.jpg" alt="Photo 9" /></div>
      <div class="slide"><img src="Ibadan.jpg" alt="Photo 10" /></div>
      <div class="slide"><img src="dancing.jpg" alt="Photo 11" /></div>

      <button class="slider__btn slider__btn--left">&larr;</button>
      <button class="slider__btn slider__btn--right">&rarr;</button>
      <div class="dots"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
